spring.datasource.url=jdbc:postgresql://localhost/blogdb
spring.datasource.username=user
spring.datasource.password=password
spring.sql.init.mode=always
#
# Logging level
#
logging.level.com.example=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.web=DEBUG
#
# Server-Sent-Events transport for the subscriptions, the request has to stay open.
#
spring.mvc.async.request-timeout=45000
#
# The GraphQL endpoint is served under /graphql: the plain HTTP requests, the
# Server-Sent-Events transport and the WebSocket transport all share that path.
#
spring.graphql.websocket.path=/graphql
spring.graphql.websocket.connection-init-timeout=30s
spring.graphql.websocket.keep-alive=60s
spring.graphql.http.sse.timeout=45s
