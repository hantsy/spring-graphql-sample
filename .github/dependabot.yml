# Dependabot covers the active example projects plus the shared GitHub Actions
# workflows. The projects under /legacy are intentionally excluded: their upstream
# libraries are discontinued or inactive, and they stay pinned to the Spring Boot,
# Java and Gradle versions they were last verified with.
#
# The file has three update entries:
#   1. Maven - all Java/Kotlin example projects, updates grouped by ecosystem:
#      dgs, spring, kotlin, testing.
#   2. npm - the Angular subscription clients, updates grouped by angular,
#      apollo-graphql, tooling.
#   3. GitHub Actions workflows.
#
# Note: the DGS platform BOM (graphql-dgs-platform-dependencies) does NOT manage
# the dgs-codegen shared-core or the dgs-codegen Maven plugin versions, so those
# stay explicitly declared in each pom and are updated here like any other
# dependency (they land in the "dgs" group).
version: 2
updates:
  # Java / Kotlin Maven projects
  - package-ecosystem: "maven"
    directories:
      - "/dgs"
      - "/dgs-webflux"
      - "/dgs-client"
      - "/dgs-codegen"
      - "/dgs-fileupload"
      - "/dgs-kotlin"
      - "/dgs-kotlin-co"
      - "/dgs-subscription-ws"
      - "/dgs-subscription-sse"
      - "/graphql-kotlin"
      - "/spring-graphql"
      - "/spring-graphql-querydsl"
      - "/spring-graphql-webmvc-http"
      - "/spring-graphql-webmvc-http-ws"
      - "/spring-graphql-webmvc-ws"
      - "/spring-graphql-webflux-http"
      - "/spring-graphql-webflux-http-ws"
      - "/spring-graphql-webflux-ws"
      - "/spring-graphql-rsocket-kotlin-co"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    reviewers:
      - "hantsy"
    assignees:
      - "hantsy"
    labels:
      - "dependencies"
    groups:
      dgs:
        patterns:
          - "com.netflix.graphql.dgs*:*"
      spring:
        patterns:
          - "org.springframework*:*"
          - "io.micrometer:*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*:*"
          - "com.expediagroup:*"
      testing:
        patterns:
          - "org.testcontainers:*"
          - "org.junit*:*"
          - "io.kotest*:*"
          - "io.mockk:*"

  # Angular clients. Major and minor updates are ignored because they require a
  # coordinated migration of the whole Angular toolchain.
  - package-ecosystem: "npm"
    directories:
      - "/dgs-subscription-ui"
      - "/dgs-subscription-ui-signals"
      - "/dgs-subscription-ui-sse"
      - "/dgs-subscription-ui-sse-signals"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    reviewers:
      - "hantsy"
    assignees:
      - "hantsy"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "rxjs"
          - "tslib"
      apollo-graphql:
        patterns:
          - "@apollo/*"
          - "apollo-angular"
          - "graphql"
          - "graphql-ws"
          - "graphql-sse"
      tooling:
        patterns:
          - "typescript"
          - "vitest"
          - "jsdom"
          - "prettier"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    reviewers:
      - "hantsy"
    assignees:
      - "hantsy"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
