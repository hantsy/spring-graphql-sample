  # Angular client. Major and minor updates are ignored because they require a
  # coordinated migration of the whole Angular toolchain.
  - package-ecosystem: "npm"
    directory: "/dgs-subscription-ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    reviewers:
      - "hantsy"
    assignees:
      - "hantsy"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
