  # ---------------------------------------------------------------------------
  # 2. npm projects (Angular clients)
  # Major and minor updates are ignored because they require a coordinated
  # migration of the whole Angular toolchain.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/dgs-subscription-ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    reviewers:
      - "hantsy"
    assignees:
      - "hantsy"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "rxjs"
          - "tslib"
      apollo-graphql:
        patterns:
          - "@apollo/*"
          - "apollo-angular"
          - "graphql"
          - "graphql-ws"
          - "graphql-sse"
      tooling:
        patterns:
          - "typescript"
          - "vitest"
          - "jsdom"
          - "prettier"

