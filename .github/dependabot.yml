# Dependabot covers the active example projects plus the shared GitHub Actions
# workflows. The projects under /legacy are intentionally excluded: their upstream
# libraries are discontinued or inactive, and they stay pinned to the Spring Boot,
# Java and Gradle versions they were last verified with.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    reviewers:
      - "hantsy"
    assignees:
      - "hantsy"
    labels:
      - "dependencies"

  - package-ecosystem: "gradle"
    directory: "/dgs"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    reviewers:
      - "hantsy"
    assignees:
      - "hantsy"
    labels:
      - "dependencies"

  - package-ecosystem: "gradle"
    directory: "/dgs-webflux"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    reviewers:
      - "hantsy"
