name: gh-pages

on:
  push:
    paths:
      - "docs/**"
      - "mkdocs.yml"
    branches:
      - master
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: |
          pip install mkdocs-material
          pip install mkdocs-git-revision-date-plugin
      - run: mkdocs gh-deploy --force