site_name: Spring GraphQL by Example

repo_url: https://github.com/hantsy/spring-graphql-sample
repo_name: hantsy/spring-graphql-sample
theme:
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: pink
      accent: pink
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: pink
      accent: pink
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  name: material
  features:
    - search.suggest
    - navigation.expand
    - navigation.indexes
  icon:
    repo: fontawesome/brands/git-alt

copyright: Copyright &copy;2026 Hantsy
extra:
  social:
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/hantsy
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/hantsy
    - icon: fontawesome/brands/medium
      link: https://medium.com/@hantsy
    - icon: fontawesome/brands/github
      link: https://github.com/hantsy

markdown_extensions:
  - meta
  - toc:
      toc_depth: 3
      permalink: true
  - admonition
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
plugins:
  - search
  - git-revision-date

nav:
  - Preface:
    - index.md
  - "An introduction to GraphQL and Spring": intro.md
  - Netflix DGS:
    - "Getting started": dgs/start.md