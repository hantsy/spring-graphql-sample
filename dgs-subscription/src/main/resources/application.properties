#dgs.graphql.schema-locations[0]=
logging.level.com.example=DEBUG
logging.level.web=DEBUG
logging.level.reactor.core.publisher=TRACE

#
# The path prefix of the GraphQL endpoint. The HTTP endpoint, the Server-Sent-Events endpoint
# and the WebSocket endpoint are all served under this path:
#
#   POST /graphql  (Accept: application/json)   -> query and mutation
#   POST /graphql  (Accept: text/event-stream)  -> subscription over Server-Sent-Events
#   WS   /graphql  (graphql-transport-ws)       -> subscription over WebSocket
#
spring.graphql.path=/graphql
spring.graphql.websocket.path=/graphql
spring.graphql.websocket.connection-init-timeout=30s
spring.graphql.websocket.keep-alive=60s

# The SSE response stays open as long as the subscription is active.
spring.graphql.http.sse.timeout=45s
spring.mvc.async.request-timeout=45000
